<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose track</title>
<!--
  pose_track.html: track a dancer's pose in a LOCAL video, frame by frame, with MediaPipe PoseLandmarker,
  and save the landmarks for scripts/cinema/pose_retarget.py (its docstring has the whole pipeline).
  Open it through the dev server so it can read the video from the repo:
    http://localhost:5173/scripts/cinema/pose_track.html?src=/refs/dance.mp4&from=127&to=162
  (src: the video's URL, from/to: the stretch in seconds; or pick a file below). Track steps through the
  video at `fps` (default 30), seeking to each frame and running the landmarker on it, so the result does
  not depend on playback speed. Save downloads dance_pose.json; window.__pose holds it too (for a script).
  The library comes from jsdelivr (pinned) and the model from Google's model store, at tracking time only.
-->
<style>
  :root { color-scheme: dark; --bg: #111; --fg: #eee; --dim: #999; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .stage { position: relative; display: inline-block; max-width: 100%; }
  video, canvas { max-width: 100%; display: block; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  button { font: inherit; padding: 6px 14px; }
  #log { color: var(--dim); }
</style>
</head>
<body>
<div class="row">
  <input type="file" id="file" accept="video/*">
  <label>from <input id="from" type="number" step="0.01" value="0" style="width:6em"></label>
  <label>to <input id="to" type="number" step="0.01" value="0" style="width:6em"> (0 = end)</label>
  <label>fps <input id="fps" type="number" value="30" style="width:4em"></label>
  <button id="track" disabled>Track</button>
  <button id="save" disabled>Save</button>
  <span id="log">Loading the model...</span>
</div>
<div class="stage"><video id="video" muted playsinline crossorigin="anonymous"></video><canvas id="overlay"></canvas></div>
<script type="module">
import { FilesetResolver, PoseLandmarker, DrawingUtils } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs'

const $ = id => document.getElementById(id)
const video = $('video'), overlay = $('overlay'), log = m => ($('log').textContent = m)
const q = new URLSearchParams(location.search)
if (q.get('from')) $('from').value = q.get('from')
if (q.get('to')) $('to').value = q.get('to')
if (q.get('fps')) $('fps').value = q.get('fps')

const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm')
const landmarker = await PoseLandmarker.createFromOptions(vision, {
  baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task', delegate: 'GPU' },
  runningMode: 'VIDEO', numPoses: 1, minPoseDetectionConfidence: 0.4, minPosePresenceConfidence: 0.4, minTrackingConfidence: 0.4,
})
log('Model ready. Load a video.')

const ready = () => new Promise(r => (video.readyState >= 2 ? r() : video.addEventListener('loadeddata', r, { once: true })))
const seek = t => new Promise(r => { video.addEventListener('seeked', r, { once: true }); video.currentTime = t })
const load = async src => { video.src = src; await ready(); overlay.width = video.videoWidth; overlay.height = video.videoHeight; $('track').disabled = false; log(`${video.videoWidth}x${video.videoHeight}, ${video.duration.toFixed(2)} s`) }
$('file').onchange = e => e.target.files[0] && load(URL.createObjectURL(e.target.files[0]))
if (q.get('src')) load(q.get('src'))

const pt = l => [+l.x.toFixed(5), +l.y.toFixed(5), +l.z.toFixed(5), +(l.visibility ?? 1).toFixed(3)]
$('track').onclick = async () => {
  $('track').disabled = $('save').disabled = true
  const fps = +$('fps').value || 30, from = +$('from').value || 0, to = +$('to').value || video.duration
  const draw = new DrawingUtils(overlay.getContext('2d'))
  const frames = []
  const n = Math.floor((to - from) * fps)
  for (let i = 0; i <= n; i++) {
    const t = from + i / fps
    await seek(Math.min(t, video.duration - 1e-3))
    const res = landmarker.detectForVideo(video, Math.round(i * 1000 / fps) + 1)
    const ok = res.worldLandmarks?.length > 0
    frames.push({ t: +(i / fps).toFixed(4), world: ok ? res.worldLandmarks[0].map(pt) : null, image: ok ? res.landmarks[0].map(pt) : null })
    const g = overlay.getContext('2d')
    g.clearRect(0, 0, overlay.width, overlay.height)
    if (ok) draw.drawConnectors(res.landmarks[0], PoseLandmarker.POSE_CONNECTIONS, { color: '#3cf', lineWidth: 3 })
    if (i % 10 === 0) log(`Frame ${i} / ${n}${ok ? '' : ' (no one found)'}`)
  }
  window.__pose = { source: video.currentSrc, fps, aspect: video.videoWidth / video.videoHeight, from, frames }
  const missed = frames.filter(f => !f.world).length
  log(`Done: ${frames.length} frames, ${missed} without a pose. Save, then run pose_retarget.py.`)
  $('track').disabled = $('save').disabled = false
}
$('save').onclick = () => {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([JSON.stringify(window.__pose)], { type: 'application/json' }))
  a.download = 'dance_pose.json'
  a.click()
}
</script>
</body>
</html>
