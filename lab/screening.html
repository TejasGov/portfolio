<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab · A screening</title>
    <style>
      .card { position: fixed; left: clamp(20px, 6vw, 96px); bottom: clamp(28px, 12svh, 140px); z-index: 3; max-width: 30rem; color: #eef4ff; pointer-events: none; }
      .card h2 { font: 400 clamp(3.2rem, 8vw, 7rem)/.9 var(--font-display); margin: .25em 0 .2em; letter-spacing: -.02em; }
      .card p { font: 400 clamp(1.05rem, 1.5vw, 1.3rem)/1.45 var(--font-serif); color: #c9d6ee; margin: 0; }
      .card .tech { font: 500 11px/1.6 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: #8fb0e8; margin-top: 1.1rem; }
      .reel { position: fixed; right: clamp(20px, 5vw, 72px); top: 50%; transform: translateY(-50%); z-index: 3; display: grid; gap: 10px; font: 500 11px/1 var(--font-mono); letter-spacing: .16em; color: #9fb4d8; text-align: right; }
      .reel b { color: #fff; font-weight: 500; }
      @media (max-width: 760px) { .reel { display: none; } .card { bottom: 8svh; } }
    </style>
  </head>
  <body>
    <canvas class="gl" id="gl" aria-hidden="true"></canvas>
    <div class="card" id="card">
      <p class="kick">Now showing · 03 / 05</p>
      <h2 id="ptitle">Revere</h2>
      <p id="pline"></p>
      <p class="tech" id="ptech"></p>
    </div>
    <div class="reel" aria-hidden="true">
      <span>01 Smash Cricket</span><span>02 CogniFlow</span><span><b>03 Revere</b></span><span>04 Yudhveer</span><span>05 Commit City</span>
    </div>
    <p class="cue" id="cue">SCROLL</p>
    <main><section id="track" style="height: 420svh"></section></main>
    <p class="lab-tag"><a href="/lab/">← lab</a> · screening · dust → blueprint → solid</p>
    <script type="module" src="/src/lab/screening.js"></script>
  </body>
</html>
